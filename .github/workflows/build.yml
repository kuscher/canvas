# Builds Canvas: Patchy at the commit in UPSTREAM with patches/ applied, as one
# Android APK for arm64-v8a and x86_64 (Qt's multi-ABI build), with the stock
# NDK and Qt for Android from Qt's servers, and the same build as an App Bundle
# for Google Play. Both are unsigned: no key ever reaches this workflow. For a
# release, release.yml runs this build and signs what it made in a separate job.
#
# Local builds on the Googlebook's arm64 VM use the same patches with
# tools/toolchain.sh (the NDK's sysroot with Debian's native clang); this job
# is the reference build for releases.
name: APK

on:
  push:
    branches: [main]
    paths:
      - UPSTREAM
      - VERSION
      - patches/**
      - android/**
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/build.yml
  workflow_dispatch:
  workflow_call: # release.yml, for a tag or a dry run

permissions:
  contents: read

# github.workflow is the calling workflow's name, so a release never waits behind a push's build.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 3G
  CCACHE_COMPRESS: "true"

jobs:
  apk:
    name: Canvas APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out Canvas
        uses: actions/checkout@v4
        with:
          path: canvas

      - name: Versions
        run: |
          cat canvas/UPSTREAM canvas/VERSION | grep -v '^#' >> "$GITHUB_ENV"
          nproc; free -h; df -h / | tail -1

      - name: Check out Patchy and apply patches
        run: |
          . canvas/UPSTREAM
          git init -q patchy
          git -C patchy remote add origin "$PATCHY_REPO"
          git -C patchy fetch -q --depth 1 origin "$PATCHY_COMMIT"
          git -C patchy checkout -q --detach FETCH_HEAD
          git -C patchy -c user.name=Canvas -c user.email=ci@invalid am -q "$GITHUB_WORKSPACE"/canvas/patches/*.patch
          git -C patchy log --oneline -n 20

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build ccache
          pipx install aqtinstall

      - name: Restore Qt
        id: qt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/qt
          key: qt-${{ env.QT_VERSION }}-linux-android-v1

      - name: Install Qt
        if: steps.qt.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O qt -m qtimageformats
          for abi in android_arm64_v8a android_x86_64; do
            aqt install-qt all_os android "$QT_VERSION" "$abi" -O qt -m qtimageformats
          done
          ls qt/"$QT_VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          ls "$ANDROID_HOME/ndk"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.QT_VERSION }}-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.QT_VERSION }}-${{ env.NDK_VERSION }}-

      - name: Configure
        run: |
          Q=$GITHUB_WORKSPACE/qt/$QT_VERSION
          "$Q/android_arm64_v8a/bin/qt-cmake" -S patchy -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$Q/gcc_64" -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION" \
            "-DQT_ANDROID_ABIS=arm64-v8a;x86_64" \
            -DQT_PATH_ANDROID_ABI_arm64-v8a="$Q/android_arm64_v8a" \
            -DQT_PATH_ANDROID_ABI_x86_64="$Q/android_x86_64" \
            -DPATCHY_BUILD_TESTS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPATCHY_ANDROID_PACKAGE_DIR="$GITHUB_WORKSPACE/canvas/android" \
            -DPATCHY_ANDROID_NOTICES_FILE="$GITHUB_WORKSPACE/canvas/THIRD_PARTY_NOTICES.md" \
            -DPATCHY_ANDROID_LOGO_FILE="$GITHUB_WORKSPACE/canvas/android/brand/canvas-logo.svg" \
            -DPATCHY_ANDROID_VERSION_NAME="$VERSION_NAME" \
            -DPATCHY_ANDROID_VERSION_CODE="$VERSION_CODE" \
            -Wno-deprecated -Wno-dev

      - name: Build
        run: |
          ccache -z >/dev/null
          cmake --build build --target apk -j "$(nproc)"
          ccache -s | head -12
          apk=$(find build/android-build -name '*release-unsigned.apk' | head -1)
          mkdir -p out && cp "$apk" "out/Canvas-$VERSION_NAME-unsigned.apk"
          # The App Bundle Google Play takes (same build, both ABIs); signed with the release key where the key is.
          cmake --build build --target aab -j "$(nproc)"
          aab=$(find build/android-build -path '*/bundle/release/*' -name '*.aab' | head -1)
          [[ -n $aab ]] || { echo '::error::no release App Bundle'; exit 1; }
          cp "$aab" "out/Canvas-$VERSION_NAME-unsigned.aab"
          ls -la out

      - name: Save ccache
        # Not for a tag: no other run can restore a tag's cache, and it would push out main's.
        if: always() && github.ref_type != 'tag'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ env.QT_VERSION }}-${{ env.NDK_VERSION }}-${{ github.run_id }}

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: canvas-apk
          path: out/*.apk

      - name: Upload the unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: canvas-aab
          path: out/*.aab
          retention-days: 14

  smoke:
    # Launch check on x86_64: Android 16 in the emulator (KVM on the runner). Installs
    # the APK signed with a throwaway key, starts Canvas, and fails if the process
    # dies or logs a fatal error within a minute. The screenshot shows the window.
    name: Launch on Android 16 (x86_64 emulator)
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: system-images;android-36;default;x86_64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: canvas-apk
          path: apk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Sign with a throwaway key
        run: |
          BT=$ANDROID_HOME/build-tools/36.0.0
          [[ -x $BT/apksigner ]] || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" >/dev/null
          keytool -genkeypair -keystore ci.jks -storetype PKCS12 -storepass ci-only -alias ci \
            -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Canvas CI" >/dev/null 2>&1
          "$BT/zipalign" -f -p 4 apk/*.apk aligned.apk
          "$BT/apksigner" sign --ks ci.jks --ks-pass pass:ci-only --out Canvas.apk aligned.apk

      - name: Start the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin
          EMU=$ANDROID_HOME/emulator/emulator
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true
          "$SDKM/sdkmanager" --install emulator platform-tools "$IMAGE" > /dev/null
          echo no | "$SDKM/avdmanager" create avd -n tablet -k "$IMAGE" -d pixel_tablet -p "$ANDROID_AVD_HOME/tablet.avd"
          echo 'disk.dataPartition.size=6G' >> "$ANDROID_AVD_HOME/tablet.avd/config.ini"
          "$EMU" -avd tablet -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -memory 4096 > emulator.log 2>&1 &
          timeout 300 adb wait-for-device || { tail -40 emulator.log; exit 1; }
          timeout 900 bash -c 'until [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 5; done' ||
            { tail -40 emulator.log; exit 1; }
          timeout 300 bash -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 5; done'
          sleep 20

      - name: Install and launch Canvas
        run: |
          for try in 1 2 3; do adb install -r Canvas.apk && break; [[ $try == 3 ]] && exit 1; sleep 20; done
          adb logcat -c
          adb shell am start -W -n io.github.kuscher.canvas/io.github.kuscher.canvas.CanvasActivity
          sleep 60
          pid=$(adb shell pidof io.github.kuscher.canvas | tr -d '\r')
          adb logcat -d > logcat.txt
          if [[ -z $pid ]]; then
            echo "::error::Canvas is not running a minute after launch"
            grep -E "FATAL|AndroidRuntime|DEBUG|libc|qt|Qt|Canvas" logcat.txt | tail -80
            exit 1
          fi
          if grep -E "F DEBUG|FATAL EXCEPTION" logcat.txt | grep -v "^--" | head -5 | grep -q .; then
            echo "::error::a fatal error was logged"; grep -A20 -E "F DEBUG|FATAL EXCEPTION" logcat.txt | head -60; exit 1
          fi
          echo "Canvas is running (pid $pid)"

      - name: Screenshot and logs
        if: always()
        run: |
          timeout 30 adb exec-out screencap -p > screen.png || true
          timeout 30 adb logcat -d > logcat-full.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-16-launch
          path: |
            screen.png
            logcat.txt
            logcat-full.txt
            emulator.log
